<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💶 Control de Finanzas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
  .header { background: linear-gradient(135deg,#161b22,#0d1117); border-bottom: 1px solid #21262d; padding: 20px 24px 0; }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
  .subtitle { color: #7d8590; font-size: 13px; margin: 4px 0 16px; display:flex; align-items:center; gap:10px; }
  .save-ok { color: #3fb950; font-size: 12px; }
  .tabs { display: flex; overflow-x: auto; gap: 0; }
  .tab { padding: 10px 16px; border: none; cursor: pointer; font-size: 13px; color: #7d8590; background: transparent; border-bottom: 2px solid transparent; transition: all .15s; font-family: inherit; white-space: nowrap; }
  .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; font-weight: 600; }
  .body { padding: 20px 24px; max-width: 900px; margin: 0 auto; }
  .month-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .month-btn { background: #21262d; border: 1px solid #30363d; color: #e6edf3; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 16px; }
  .month-label { font-size: 14px; font-weight: 600; min-width: 80px; text-align: center; }
  .card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
  .card-title { font-size: 12px; font-weight: 600; color: #7d8590; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat { background: #0d1117; border-radius: 10px; padding: 14px 16px; }
  .stat-label { font-size: 11px; color: #7d8590; margin-bottom: 4px; }
  .stat-val { font-size: 22px; font-weight: 700; }
  .stat-sub { font-size: 11px; color: #7d8590; margin-top: 4px; }
  .track { height: 6px; border-radius: 3px; background: #21262d; margin-top: 6px; }
  .bar { height: 6px; border-radius: 3px; transition: width .4s; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: #7d8590; margin-bottom: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  input, select { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; padding: 8px 12px; font-size: 14px; font-family: inherit; outline: none; width: 100%; color-scheme: dark; }
  input:focus, select:focus { border-color: #58a6ff; }
  .btn { border: none; border-radius: 8px; color: #fff; padding: 9px 18px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-green { background: #238636; }
  .btn-blue { background: #1f6feb; }
  .btn-purple { background: #8b5cf6; }
  .btn-red { background: #b91c1c; }
  .btn-gray { background: #30363d; }
  .tx-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #21262d; }
  .badge { border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 600; }
  .week-block { margin-bottom: 14px; padding: 12px 14px; border-radius: 10px; border: 1px solid transparent; }
  .week-block.current { background: rgba(88,166,255,.06); border-color: rgba(88,166,255,.2); }
  .week-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .tx-mini { display: flex; justify-content: space-between; font-size: 11px; color: #7d8590; padding: 2px 0; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .section { display: none; }
  .section.active { display: block; }
  #import-input { display: none; }
  .danger-zone { border-color: #f8514933; }
</style>
</head>
<body>

<div class="header">
  <h1>💶 Control de Finanzas</h1>
  <div class="subtitle">
    <span id="subtitle-date">Gestión personal</span>
    <span class="save-ok" id="save-status"></span>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="body">
  <div class="month-nav">
    <button class="month-btn" onclick="changeMonth(-1)">‹</button>
    <span class="month-label" id="month-label"></span>
    <button class="month-btn" onclick="changeMonth(1)">›</button>
  </div>

  <!-- Toolbar: export/import -->
  <div class="toolbar">
    <button class="btn btn-gray" onclick="exportData()">💾 Exportar datos</button>
    <button class="btn btn-gray" onclick="document.getElementById('import-input').click()">📂 Importar datos</button>
    <input type="file" id="import-input" accept=".json" onchange="importData(event)">
  </div>

  <!-- DASHBOARD -->
  <div class="section active" id="tab-dashboard">
    <div class="stat-grid" id="stat-grid"></div>
    <div id="weeks-section"></div>
    <div class="card" id="cat-breakdown"></div>
  </div>

  <!-- MOVIMIENTOS -->
  <div class="section" id="tab-transactions">
    <div class="card" id="tx-list"></div>
  </div>

  <!-- PRESUPUESTO -->
  <div class="section" id="tab-budget">
    <div class="card" id="budget-section"></div>
  </div>

  <!-- AÑADIR -->
  <div class="section" id="tab-add">
    <div class="card">
      <div class="card-title">Nuevo movimiento</div>
      <div class="grid2">
        <div class="field">
          <label>Tipo</label>
          <select id="form-type" onchange="updateCategoryOptions()">
            <option value="expense">💸 Gasto</option>
            <option value="income">💰 Ingreso</option>
          </select>
        </div>
        <div class="field">
          <label>Categoría</label>
          <select id="form-category"></select>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Importe (€)</label>
          <input type="number" id="form-amount" placeholder="0.00">
        </div>
        <div class="field">
          <label>Fecha</label>
          <input type="date" id="form-date">
        </div>
      </div>
      <div class="field">
        <label>Descripción</label>
        <input type="text" id="form-desc" placeholder="Ej: Gasolinera Repsol">
      </div>
      <button class="btn btn-green" onclick="addTransaction()">➕ Añadir movimiento</button>
    </div>
  </div>

  <!-- EXTRAS -->
  <div class="section" id="tab-extras">
    <div class="card">
      <div class="card-title">Registrar extra de nómina</div>
      <div class="field"><label>Descripción</label><input type="text" id="ex-desc" placeholder="Ej: Paga extra junio"></div>
      <div class="grid2">
        <div class="field"><label>💰 Total recibido (€)</label><input type="number" id="ex-amount" placeholder="0.00" oninput="updateExtraPreview()"></div>
        <div class="field"><label>Fecha</label><input type="date" id="ex-date"></div>
      </div>
      <div class="card-title" style="margin-top:8px">Distribución del extra</div>
      <div class="grid2">
        <div class="field"><label style="color:#f87171">💳 Créditos</label><input type="number" id="ex-creditos" placeholder="0.00" style="border-color:#f87171" oninput="updateExtraPreview()"></div>
        <div class="field"><label style="color:#a78bfa">📈 Inversión</label><input type="number" id="ex-inversion" placeholder="0.00" style="border-color:#a78bfa" oninput="updateExtraPreview()"></div>
      </div>
      <div class="grid2">
        <div class="field"><label style="color:#58a6ff">🏦 Ahorro</label><input type="number" id="ex-ahorro" placeholder="0.00" style="border-color:#58a6ff" oninput="updateExtraPreview()"></div>
        <div class="field"><label style="color:#94a3b8">📦 Otros</label><input type="number" id="ex-otros" placeholder="0.00" style="border-color:#94a3b8" oninput="updateExtraPreview()"></div>
      </div>
      <div id="extra-preview" style="display:none" class="card" style="background:#0d1117;margin-bottom:12px"></div>
      <button class="btn btn-purple" onclick="addExtra()">⭐ Guardar extra</button>
    </div>
    <div id="extras-history"></div>
  </div>

</div>

<script>
const MONTHS = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const fmt = n => new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(n);
const COLORS = {creditos:"#f87171",gasolina:"#fbbf24",padel:"#34d399",movil:"#60a5fa",spotify:"#1db954",ingles:"#f472b6",ahorro:"#58a6ff",otros_gas:"#94a3b8",salario:"#10b981",otros_ing:"#f59e0b"};
const FIXED_CATS = ["creditos","gasolina","padel","movil","spotify","ingles","ahorro"];
const CATEGORIES = {
  income: [{id:"salario",label:"Salario",icon:"💼"},{id:"otros_ing",label:"Otros ingresos",icon:"✨"}],
  expense: [{id:"creditos",label:"Créditos",icon:"💳"},{id:"gasolina",label:"Gasolina",icon:"⛽"},{id:"padel",label:"Pádel",icon:"🎾"},{id:"movil",label:"Móvil",icon:"📱"},{id:"spotify",label:"Spotify",icon:"🎵"},{id:"ingles",label:"Academia inglés",icon:"📚"},{id:"ahorro",label:"Ahorro",icon:"🏦"},{id:"otros_gas",label:"Otros gastos",icon:"📦"}]
};

const now = new Date();
let filterMonth = now.getMonth();
let filterYear = now.getFullYear();
let editingBudget = false;

// ── STATE ──────────────────────────────────────────────────
const DEFAULT_TX = () => {
  const m = String(now.getMonth()+1).padStart(2,"0"), y = now.getFullYear();
  return [
    {id:1,type:"expense",category:"creditos", amount:211,  desc:"Créditos",          date:`${y}-${m}-01`},
    {id:2,type:"expense",category:"gasolina", amount:450,  desc:"Gasolina",          date:`${y}-${m}-03`},
    {id:3,type:"expense",category:"ahorro",   amount:300,  desc:"Ahorro mensual",    date:`${y}-${m}-01`},
    {id:4,type:"expense",category:"ingles",   amount:89,   desc:"Academia de inglés",date:`${y}-${m}-05`},
    {id:5,type:"expense",category:"padel",    amount:36,   desc:"Club pádel",        date:`${y}-${m}-06`},
    {id:6,type:"expense",category:"movil",    amount:10,   desc:"Tarifa móvil",      date:`${y}-${m}-07`},
    {id:7,type:"expense",category:"spotify",  amount:11.99,desc:"Spotify Premium",   date:`${y}-${m}-08`},
  ];
};
const DEFAULT_BUDGETS = {creditos:211,gasolina:450,padel:36,movil:10,spotify:11.99,ingles:89,ahorro:300,otros_gas:50};

let state = { transactions: [], extras: [], budgets: {...DEFAULT_BUDGETS} };

// ── STORAGE ────────────────────────────────────────────────
function saveState() {
  try {
    localStorage.setItem("finanzas_tx", JSON.stringify(state.transactions));
    localStorage.setItem("finanzas_ex", JSON.stringify(state.extras));
    localStorage.setItem("finanzas_bu", JSON.stringify(state.budgets));
    showSaved();
  } catch(e) { console.error("Error guardando:", e); }
}

function loadState() {
  try {
    const tx = localStorage.getItem("finanzas_tx");
    const ex = localStorage.getItem("finanzas_ex");
    const bu = localStorage.getItem("finanzas_bu");
    state.transactions = tx ? JSON.parse(tx) : DEFAULT_TX();
    state.extras       = ex ? JSON.parse(ex) : [];
    state.budgets      = bu ? JSON.parse(bu) : {...DEFAULT_BUDGETS};
  } catch(e) {
    state.transactions = DEFAULT_TX();
  }
}

// ── EXPORT / IMPORT ────────────────────────────────────────
function exportData() {
  const data = { transactions: state.transactions, extras: state.extras, budgets: state.budgets, exportDate: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `finanzas_${new Date().toISOString().split("T")[0]}.json`;
  a.click();
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.transactions) state.transactions = data.transactions;
      if (data.extras)       state.extras       = data.extras;
      if (data.budgets)      state.budgets      = data.budgets;
      saveState();
      render();
      alert("✅ Datos importados correctamente");
    } catch(err) { alert("❌ Error al importar el archivo"); }
  };
  reader.readAsText(file);
  e.target.value = "";
}

// ── HELPERS ────────────────────────────────────────────────
function showSaved() {
  const el = document.getElementById("save-status");
  el.textContent = "✓ Guardado";
  setTimeout(() => el.textContent = "", 1500);
}

function getWeek(dateStr) {
  const day = new Date(dateStr).getDate();
  if (day <= 7) return 0; if (day <= 14) return 1; if (day <= 21) return 2; return 3;
}

function getCat(id) {
  return [...CATEGORIES.income, ...CATEGORIES.expense].find(c => c.id === id) || {label:id, icon:"•"};
}

function getFiltered() {
  return state.transactions.filter(t => {
    const d = new Date(t.date);
    return d.getMonth() === filterMonth && d.getFullYear() === filterYear;
  });
}

// ── ACTIONS ────────────────────────────────────────────────
function addTransaction() {
  const amount = parseFloat(document.getElementById("form-amount").value);
  const date   = document.getElementById("form-date").value;
  const type   = document.getElementById("form-type").value;
  const cat    = document.getElementById("form-category").value;
  const desc   = document.getElementById("form-desc").value;
  if (!amount || !date) return alert("Rellena importe y fecha");
  state.transactions.push({id: Date.now(), type, category: cat, amount, desc, date});
  saveState();
  document.getElementById("form-amount").value = "";
  document.getElementById("form-desc").value = "";
  render();
}

function deleteTransaction(id) {
  state.transactions = state.transactions.filter(t => t.id !== id);
  saveState(); render();
}

function addExtra() {
  const amount = parseFloat(document.getElementById("ex-amount").value);
  const date   = document.getElementById("ex-date").value;
  if (!amount || !date) return alert("Rellena importe y fecha");
  state.extras.push({
    id: Date.now(),
    desc: document.getElementById("ex-desc").value,
    amount, date,
    dist: {
      creditos:  parseFloat(document.getElementById("ex-creditos").value)  || 0,
      inversion: parseFloat(document.getElementById("ex-inversion").value) || 0,
      ahorro:    parseFloat(document.getElementById("ex-ahorro").value)    || 0,
      otros:     parseFloat(document.getElementById("ex-otros").value)     || 0,
    }
  });
  saveState();
  ["ex-desc","ex-amount","ex-creditos","ex-inversion","ex-ahorro","ex-otros"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("extra-preview").style.display = "none";
  render();
}

function deleteExtra(id) {
  state.extras = state.extras.filter(e => e.id !== id);
  saveState(); render();
}

function saveBudgets() {
  CATEGORIES.expense.forEach(cat => {
    const el = document.getElementById("budget-input-"+cat.id);
    if (el) state.budgets[cat.id] = parseFloat(el.value) || 0;
  });
  editingBudget = false;
  saveState(); render();
}

function changeMonth(dir) {
  filterMonth = (filterMonth + 12 + dir) % 12;
  render();
}

// ── TABS ───────────────────────────────────────────────────
const TAB_LIST = [["dashboard","📊 Resumen"],["transactions","📋 Movimientos"],["budget","🎯 Presupuesto"],["add","➕ Añadir"],["extras","⭐ Extras"]];
let activeTab = "dashboard";

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = TAB_LIST.map(([id,label]) =>
    `<button class="tab ${activeTab===id?'active':''}" onclick="switchTab('${id}')">${label}</button>`
  ).join("");
}

function switchTab(id) {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById("tab-"+id).classList.add("active");
  activeTab = id;
  renderTabs();
}

// ── RENDER ─────────────────────────────────────────────────
function render() {
  document.getElementById("month-label").textContent = `${MONTHS[filterMonth]} ${filterYear}`;
  document.getElementById("subtitle-date").textContent = `Gestión personal · ${MONTHS[filterMonth]} ${filterYear}`;
  renderTabs();
  updateCategoryOptions();
  renderDashboard();
  renderTransactions();
  renderBudget();
  renderExtras();
}

function renderDashboard() {
  const filtered = getFiltered();
  const totalIncome  = filtered.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const totalExpense = filtered.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  const balance  = totalIncome - totalExpense;
  const perWeek  = balance > 0 ? balance / 4 : 0;

  // Stats
  document.getElementById("stat-grid").innerHTML = `
    <div class="stat" style="border:1px solid #3fb95033">
      <div class="stat-label">Ingresos</div>
      <div class="stat-val" style="color:#3fb950">${totalIncome>0?fmt(totalIncome):"—"}</div>
      ${totalIncome===0?'<div class="stat-sub">Añade tu nómina</div>':''}
    </div>
    <div class="stat" style="border:1px solid #f8514933">
      <div class="stat-label">Gastos</div>
      <div class="stat-val" style="color:#f85149">${fmt(totalExpense)}</div>
    </div>
    <div class="stat" style="border:1px solid ${balance>=0?'#58a6ff':'#f85149'}33">
      <div class="stat-label">Restante</div>
      <div class="stat-val" style="color:${balance>=0?'#58a6ff':'#f85149'}">${fmt(balance)}</div>
    </div>
    <div class="stat" style="border:1px solid #f59e0b33">
      <div class="stat-label">Por semana · 4 semanas</div>
      <div class="stat-val" style="color:#f59e0b">${perWeek>0?fmt(perWeek):"—"}</div>
      ${perWeek>0?'<div class="stat-sub">gasto diario libre</div>':''}
    </div>
  `;

  // Weekly
  const daysInMonth = new Date(filterYear, filterMonth+1, 0).getDate();
  const freeTx = filtered.filter(t=>t.type==="expense"&&!FIXED_CATS.includes(t.category));
  const weekSpent = [0,0,0,0];
  const weekTxs   = [[],[],[],[]];
  freeTx.forEach(t => { const w=getWeek(t.date); weekSpent[w]+=t.amount; weekTxs[w].push(t); });

  let weeksHtml = "";
  if (perWeek > 0) {
    weeksHtml = `<div class="card"><div class="card-title">Semanas del mes · ${fmt(perWeek)} disponible/semana</div>`;
    for (let w=0;w<4;w++) {
      const spent = weekSpent[w];
      const remaining = perWeek - spent;
      const over = remaining < 0;
      const pct = Math.min((spent/perWeek)*100,100);
      const weekStart = w*7+1, weekEnd = Math.min(weekStart+6, daysInMonth);
      const isCurrent = now.getMonth()===filterMonth && now.getFullYear()===filterYear && getWeek(now.toISOString().split("T")[0])===w;
      const miniTx = weekTxs[w].map(t=>{const c=getCat(t.category);return `<div class="tx-mini"><span>${c.icon} ${t.desc||c.label}</span><span>${fmt(t.amount)}</span></div>`;}).join("");
      weeksHtml += `
        <div class="week-block ${isCurrent?'current':''}">
          <div class="week-header">
            <div>
              <span style="font-size:13px;font-weight:600;color:${isCurrent?'#58a6ff':'#e6edf3'}">Semana ${w+1}</span>
              <span style="font-size:11px;color:#7d8590;margin-left:8px">${MONTHS[filterMonth]} ${weekStart}–${weekEnd}${isCurrent?' <span style="color:#58a6ff">← ahora</span>':''}</span>
            </div>
            <div style="text-align:right">
              <span style="font-size:13px;font-weight:700;color:${over?'#f85149':'#3fb950'}">${over?'−':'+'}${fmt(Math.abs(remaining))}</span>
              <span style="font-size:11px;color:#7d8590;margin-left:6px">gastado ${fmt(spent)}</span>
            </div>
          </div>
          <div class="track"><div class="bar" style="width:${pct}%;background:${over?'#f85149':'#238636'}"></div></div>
          ${miniTx || '<div style="font-size:11px;color:#7d8590;margin-top:6px">Sin gastos esta semana</div>'}
        </div>`;
    }
    weeksHtml += "</div>";
  }
  document.getElementById("weeks-section").innerHTML = weeksHtml;

  // Category breakdown
  const byCat = {};
  filtered.filter(t=>t.type==="expense").forEach(t => { byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>{
    const c = getCat(cat);
    const pct = totalExpense>0?(amt/totalExpense)*100:0;
    return `<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:13px">
        <span>${c.icon} ${c.label}</span>
        <span style="color:#7d8590">${fmt(amt)} (${pct.toFixed(0)}%)</span>
      </div>
      <div class="track"><div class="bar" style="width:${pct}%;background:${COLORS[cat]||'#58a6ff'}"></div></div>
    </div>`;
  }).join("");
  document.getElementById("cat-breakdown").innerHTML = `<div class="card-title">Gastos por categoría</div>${catRows||'<p style="color:#7d8590;font-size:13px">Sin gastos este mes.</p>'}`;
}

function renderTransactions() {
  const filtered = [...getFiltered()].reverse();
  const rows = filtered.map(t => {
    const c = getCat(t.category);
    const color = t.type==="income"?"#3fb950":"#f85149";
    return `<div class="tx-row">
      <span style="font-size:20px">${c.icon}</span>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:500">${t.desc||c.label}</div>
        <div style="font-size:11px;color:#7d8590">${t.date} · ${c.label}</div>
      </div>
      <span class="badge" style="background:${color}22;color:${color}">${t.type==="income"?"+":"-"}${fmt(t.amount)}</span>
      <button onclick="deleteTransaction(${t.id})" style="background:none;border:none;color:#7d8590;cursor:pointer;font-size:18px;padding:0 4px">×</button>
    </div>`;
  }).join("");
  document.getElementById("tx-list").innerHTML = `<div class="card-title">${filtered.length} movimientos</div>${rows||'<p style="color:#7d8590;font-size:13px">No hay movimientos este mes.</p>'}`;
}

function renderBudget() {
  const filtered = getFiltered();
  const byCat = {};
  filtered.filter(t=>t.type==="expense").forEach(t => { byCat[t.category]=(byCat[t.category]||0)+t.amount; });

  const rows = CATEGORIES.expense.map(cat => {
    const spent  = byCat[cat.id]||0;
    const budget = state.budgets[cat.id]||0;
    const pct    = budget>0?(spent/budget)*100:0;
    const over   = pct>100;
    const inputOrVal = editingBudget
      ? `<input type="number" id="budget-input-${cat.id}" value="${budget}" style="width:80px;padding:4px 8px;font-size:13px">`
      : `<span style="color:${over?'#f85149':'#7d8590'}">${fmt(spent)} / ${fmt(budget)}</span>${over?'<span style="font-size:11px;color:#f85149;margin-left:6px">⚠️ excedido</span>':''}`;
    return `<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px">
        <span>${cat.icon} ${cat.label}</span>
        <div style="display:flex;align-items:center;gap:8px">${inputOrVal}</div>
      </div>
      <div class="track"><div class="bar" style="width:${Math.min(pct,100)}%;background:${over?'#f85149':'#238636'}"></div></div>
    </div>`;
  }).join("");

  const btn = editingBudget
    ? `<button class="btn btn-green" onclick="saveBudgets()">✓ Guardar</button>`
    : `<button class="btn btn-blue" onclick="editingBudget=true;render()">✏️ Editar</button>`;

  document.getElementById("budget-section").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="card-title" style="margin-bottom:0">Presupuesto mensual</div>
      ${btn}
    </div>
    ${rows}`;
}

function renderExtras() {
  const history = [...state.extras].reverse().map(ex => {
    const asignado = ex.dist.creditos+ex.dist.inversion+ex.dist.ahorro+ex.dist.otros;
    const libre = ex.amount - asignado;
    const badges = [
      ex.dist.creditos>0?`<span class="badge" style="background:#f8717122;color:#f87171">💳 Créditos ${fmt(ex.dist.creditos)}</span>`:'',
      ex.dist.inversion>0?`<span class="badge" style="background:#a78bfa22;color:#a78bfa">📈 Inversión ${fmt(ex.dist.inversion)}</span>`:'',
      ex.dist.ahorro>0?`<span class="badge" style="background:#58a6ff22;color:#58a6ff">🏦 Ahorro ${fmt(ex.dist.ahorro)}</span>`:'',
      ex.dist.otros>0?`<span class="badge" style="background:#94a3b822;color:#94a3b8">📦 Otros ${fmt(ex.dist.otros)}</span>`:'',
      libre>0?`<span class="badge" style="background:#f59e0b22;color:#f59e0b">Sin asignar ${fmt(libre)}</span>`:'',
    ].join(" ");
    return `<div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #21262d">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div>
          <div style="font-size:14px;font-weight:600">${ex.desc||"Extra"}</div>
          <div style="font-size:11px;color:#7d8590">${ex.date}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:16px;font-weight:700;color:#3fb950">${fmt(ex.amount)}</span>
          <button onclick="deleteExtra(${ex.id})" style="background:none;border:none;color:#7d8590;cursor:pointer;font-size:18px">×</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${badges}</div>
    </div>`;
  }).join("");

  const totals = state.extras.length>0 ? `
    <div style="display:flex;justify-content:space-between;font-size:13px;padding-top:8px">
      <span style="color:#7d8590">Total extras recibidos</span>
      <span style="font-weight:700;color:#3fb950">${fmt(state.extras.reduce((s,e)=>s+e.amount,0))}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:4px">
      <span style="color:#7d8590">→ Destinado a créditos</span>
      <span style="font-weight:600;color:#f87171">${fmt(state.extras.reduce((s,e)=>s+e.dist.creditos,0))}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:4px">
      <span style="color:#7d8590">→ Destinado a inversión</span>
      <span style="font-weight:600;color:#a78bfa">${fmt(state.extras.reduce((s,e)=>s+e.dist.inversion,0))}</span>
    </div>` : "";

  document.getElementById("extras-history").innerHTML = state.extras.length>0
    ? `<div class="card"><div class="card-title">Historial de extras</div>${history}${totals}</div>` : "";
}

function updateCategoryOptions() {
  const type = document.getElementById("form-type")?.value || "expense";
  const sel  = document.getElementById("form-category");
  if (!sel) return;
  sel.innerHTML = CATEGORIES[type].map(c=>`<option value="${c.id}">${c.icon} ${c.label}</option>`).join("");
}

function updateExtraPreview() {
  const total    = parseFloat(document.getElementById("ex-amount").value)||0;
  const creditos = parseFloat(document.getElementById("ex-creditos").value)||0;
  const inversion= parseFloat(document.getElementById("ex-inversion").value)||0;
  const ahorro   = parseFloat(document.getElementById("ex-ahorro").value)||0;
  const otros    = parseFloat(document.getElementById("ex-otros").value)||0;
  const asignado = creditos+inversion+ahorro+otros;
  const restante = total-asignado;
  const preview  = document.getElementById("extra-preview");
  if (total<=0){preview.style.display="none";return;}
  preview.style.display="block";
  const barSegs = [
    {v:creditos,c:"#f87171"},{v:inversion,c:"#a78bfa"},{v:ahorro,c:"#58a6ff"},{v:otros,c:"#94a3b8"}
  ].map(s=>{const p=total>0?(s.v/total)*100:0;return p>0?`<div style="width:${p}%;background:${s.c};height:6px;border-radius:3px"></div>`:""}).join("");
  preview.innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
      <span style="color:#7d8590">Total asignado</span><span>${fmt(asignado)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:8px">
      <span style="color:#7d8590">Sin asignar</span>
      <span style="color:${restante<0?'#f85149':restante===0?'#3fb950':'#f59e0b'}">${fmt(restante)}</span>
    </div>
    <div style="display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden">${barSegs}</div>`;
}

// ── INIT ───────────────────────────────────────────────────
document.getElementById("form-date").value = now.toISOString().split("T")[0];
document.getElementById("ex-date").value   = now.toISOString().split("T")[0];
loadState();
render();
</script>
</body>
</html>
